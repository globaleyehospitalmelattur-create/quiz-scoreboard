<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EYECON 4.0 - National Optometry Conference, Calicut</title>
    <!-- Confetti effect-inu vendulla library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-blue: #0047ff;
            --neon-green: #84cc16;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --winner-bg: #fef08a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 950px;
            box-sizing: border-box;
            border-top: 6px solid var(--neon-green);
        }

        /* EYECON 4.0 Poster Header Styles */
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .optometry-logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(0, 71, 255, 0.2);
            margin-bottom: 15px;
            border: 2px solid var(--neon-green);
        }

        .optometry-logo-badge span {
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .brand-header h1 {
            margin: 0;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .brand-header h1 span {
            color: var(--primary-blue);
        }

        .sub-title {
            margin: 6px 0 0 0;
            color: #16a34a;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .location {
            margin: 4px 0 0 0;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            text-align: center;
        }

        th, td {
            padding: 18px 15px;
            vertical-align: middle;
        }

        th {
            background: linear-gradient(135deg, var(--primary-blue), #1d4ed8);
            color: white;
            font-weight: 600;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:not(:last-child) td {
            border-bottom: 1px solid var(--border-color);
        }

        tr:nth-child(even) td {
            background-color: #f8fafc;
        }

        tbody tr {
            opacity: 0;
            transform: translateY(20px);
            animation: cinematicFadeIn 0.8s ease forwards;
        }

        @keyframes cinematicFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        input[type="number"] {
            width: 65px;
            padding: 10px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            background-color: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            background-color: #ffffff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(0, 71, 255, 0.15);
        }

        .total-mark {
            font-weight: 800;
            color: #16a34a;
            font-size: 20px;
        }

        .team-name {
            font-weight: 700;
            color: #334155;
            font-size: 17px;
            text-align: left;
            padding-left: 25px;
        }

        .winner-row td {
            background-color: var(--winner-bg) !important;
            transition: background-color 0.5s ease;
        }

        /* New Optometry Pulse / Laser Scan Loading Animation */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 40px 0;
            gap: 15px;
        }

        .optom-scanner {
            width: 60px;
            height: 60px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--primary-blue);
            border-bottom: 4px solid var(--neon-green);
            border-radius: 50%;
            animation: scanSpin 1s linear infinite;
            position: relative;
        }

        .optom-scanner::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 3px dashed var(--primary-blue);
            border-radius: 50%;
            animation: scanSpinReverse 2s linear infinite;
        }

        @keyframes scanSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes scanSpinReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <div class="optometry-logo-badge">
            <span>👁️ VTRUST • ASCO • OPTO</span>
        </div>
        <h1>EYECON <span>4.0</span></h1>
        <div class="sub-title">National Optometry Conference</div>
        <div class="location">📍 Kozhikode, Kerala</div>
    </div>
    
    <!-- New Optometry Loading Animation -->
    <div id="status" class="loading-container">
        <div class="optom-scanner"></div>
        <div class="loading-text">Data load cheyyunnu...</div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th style="text-align: left; padding-left: 25px;">Teams</th>
                    <th>Round 1</th>
                    <th>Round 2</th>
                    <th>Round 3</th>
                    <th>Round 4</th>
                    <th>Round 5</th>
                    <th>Total Mark</th>
                </tr>
            </thead>
            <tbody id="scoreTableBody">
                <!-- Data ivide load aakum -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const teamNames = ["Team A", "Team B", "Team C", "Team D", "Team E"];
    const appScriptUrl = "https://script.google.com/macros/s/AKfycbyUFELQsY3E2GPkFY62aV2q2y2z6w2kvryHuibo2PMljwEVLaEcnHHjpwWMxeSgYkeVeA/exec"; 

    let sheetData = [];

    async function loadSheetData() {
        try {
            let response = await fetch(appScriptUrl);
            if (!response.ok) {
                throw new Error("Network response was not ok");
            }
            sheetData = await response.json();
            renderTable();
            document.getElementById("status").style.display = "none";
        } catch (error) {
            console.error("Error loading sheet:", error);
            sheetData = [];
            renderTable();
            document.getElementById("status").innerHTML = '<div style="color: #ef4444;">Data load cheyyunnathil tholvi sambhavichu. URL പരിശോധിക്കുക!</div>';
        }
    }

    function renderTable() {
        const tableBody = document.getElementById("scoreTableBody");
        tableBody.innerHTML = "";

        let teamsArray = teamNames.map((team, index) => {
            let rounds = [];
            let total = 0;
            let hasValue = false;
            let filledRoundsCount = 0;

            for (let i = 1; i <= 5; i++) {
                let val = "";
                if (sheetData[index + 1] && sheetData[index + 1][i] !== undefined && sheetData[index + 1][i] !== "") {
                    val = sheetData[index + 1][i];
                    total += parseFloat(val) || 0;
                    hasValue = true;
                    filledRoundsCount++;
                }
                rounds.push(val);
            }

            return {
                name: team,
                originalIndex: index,
                rounds: rounds,
                total: total,
                hasValue: hasValue,
                isAllFiveRoundsFilled: (filledRoundsCount === 5)
            };
        });

        teamsArray.sort((a, b) => {
            let valA = a.hasValue ? a.total : 999999;
            let valB = b.hasValue ? b.total : 999999;
            return valA - valB;
        });

        let allTeamsHaveFiveRounds = teamsArray.length > 0 && teamsArray.every(team => team.isAllFiveRoundsFilled);

        teamsArray.forEach((teamObj, index) => {
            let row = document.createElement("tr");
            
            let delayTime = 0;
            if (allTeamsHaveFiveRounds) {
                delayTime = index * 10;
            } else {
                delayTime = 0; 
            }
            
            row.style.animationDelay = `${delayTime}s`;

            let isLastRow = (index === teamsArray.length - 1);
            if (isLastRow && teamObj.hasValue) {
                row.className = "winner-row";
                setTimeout(() => {
                    confetti({
                        particleCount: 150,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                }, delayTime * 1000);
            }

            let teamCell = document.createElement("td");
            teamCell.className = "team-name";
            teamCell.innerText = teamObj.name;
            row.appendChild(teamCell);

            for (let i = 0; i < 5; i++) {
                let td = document.createElement("td");
                let input = document.createElement("input");
                input.type = "number";
                input.min = "0";
                input.id = `t${teamObj.originalIndex}_r${i + 1}`;
                input.value = teamObj.rounds[i];
                input.oninput = updateTotalsAndSort; 
                td.appendChild(input);
                row.appendChild(td);
            }

            let totalTd = document.createElement("td");
            totalTd.className = "total-mark";
            totalTd.id = `total_${teamObj.originalIndex}`;
            totalTd.innerText = teamObj.hasValue ? teamObj.total : "";
            row.appendChild(totalTd);

            tableBody.appendChild(row);
        });
    }

    function updateTotalsAndSort() {
        teamNames.forEach((_, index) => {
            if (!sheetData[index + 1]) sheetData[index + 1] = [teamNames[index]];
            for (let i = 1; i <= 5; i++) {
                let val = document.getElementById(`t${index}_r${i}`).value;
                sheetData[index + 1][i] = val;
            }
        });
        renderTable();
    }

    loadSheetData();
</script>

</body>
</html>
