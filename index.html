<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Cinematic Animated Score Board</title>
    <!-- Confetti effect-inu vendulla library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #4f46e5;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 950px;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 26px;
            font-weight: 700;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin-top: 10px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        th, td {
            padding: 15px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            font-size: 15px;
            text-transform: uppercase;
        }

        tr:nth-child(even) td {
            background-color: #f1f5f9;
        }

        tr:nth-child(odd) td {
            background-color: #ffffff;
        }

        /* Row-ukalude default fade-in animation */
        tbody tr {
            opacity: 0;
            transform: translateY(20px);
            animation: cinematicFadeIn 0.8s ease forwards;
        }

        @keyframes cinematicFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        input[type="number"] {
            width: 65px;
            padding: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .total-mark {
            font-weight: 700;
            color: #16a34a;
            font-size: 20px;
        }

        .team-name {
            font-weight: 700;
            color: #334155;
            font-size: 17px;
            text-align: left;
            padding-left: 20px;
        }

        /* 1st rank kittiya avasanathe winner row-kku special highlight */
        .winner-row td {
            background-color: #fef08a !important;
            transition: background-color 0.5s ease;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            gap: 10px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #64748b;
            font-size: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏆 Quiz Cinematic Score Board</h2>
    
    <div id="status" class="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">Data load cheyyunnu...</div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th style="text-align: left; padding-left: 20px;">Teams</th>
                    <th>Round 1</th>
                    <th>Round 2</th>
                    <th>Round 3</th>
                    <th>Round 4</th>
                    <th>Round 5</th>
                    <th>Total Mark</th>
                </tr>
            </thead>
            <tbody id="scoreTableBody">
                <!-- JavaScript vazhi ivide rows varum -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const teamNames = ["Team A", "Team B", "Team C", "Team D", "Team E"];
    const appScriptUrl = "https://script.google.com/macros/s/AKfycbyUFELQsY3E2GPkFY62aV2q2y2z6w2kvryHuibo2PMljwEVLaEcnHHjpwWMxeSgYkeVeA/exec"; 

    let sheetData = [];

    async function loadSheetData() {
        try {
            let response = await fetch(appScriptUrl);
            sheetData = await response.json();
            renderTable();
            document.getElementById("status").style.display = "none";
        } catch (error) {
            console.error("Error loading sheet:", error);
            renderTable();
            document.getElementById("status").innerHTML = '<div style="color: #ef4444;">Data load cheyyunnathil tholvi sambhavichu.</div>';
        }
    }

    function renderTable() {
        const tableBody = document.getElementById("scoreTableBody");
        tableBody.innerHTML = "";

        let teamsArray = teamNames.map((team, index) => {
            let rounds = [];
            let total = 0;
            let hasValue = false;
            let filledRoundsCount = 0;

            for (let i = 1; i <= 5; i++) {
                let val = "";
                if (sheetData[index + 1] && sheetData[index + 1][i] !== undefined && sheetData[index + 1][i] !== "") {
                    val = sheetData[index + 1][i];
                    total += parseFloat(val) || 0;
                    hasValue = true;
                    filledRoundsCount++;
                }
                rounds.push(val);
            }

            return {
                name: team,
                originalIndex: index,
                rounds: rounds,
                total: total,
                hasValue: hasValue,
                filledRoundsCount: filledRoundsCount
            };
        });

        // 1st Round mathram ollavaro allengil kooduthal data ulla rounds-o nokki sort cheyyunnu
        teamsArray.sort((a, b) => {
            let valA = a.hasValue ? a.total : 999999;
            let valB = b.hasValue ? b.total : 999999;
            return valA - valB;
        });

        teamsArray.forEach((teamObj, index) => {
            let row = document.createElement("tr");
            
            // Logic: 1st round mathramullavanukku delay illathe pettennu kanikkum (0s). 
            // Mattullavarkkum avasanathe winner-kkum 10 seconds vechulla delay (10s, 20s angane) set cheyyunnu.
            let delayTime = 0;
            if (teamObj.filledRoundsCount > 1 || index > 0) {
                delayTime = index * 10; // Oru row-il ninnu mattoru row-ilekku 10s delay
            }
            row.style.animationDelay = `${delayTime}s`;

            let isLastRow = (index === teamsArray.length - 1);
            if (isLastRow && teamObj.hasValue) {
                row.className = "winner-row";
                // Avasathe 1st rank team varumbol 10s delay-ude adiyil padakkam pottum (Confetti effect)
                setTimeout(() => {
                    confetti({
                        particleCount: 150,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                }, delayTime * 1000);
            }

            let teamCell = document.createElement("td");
            teamCell.className = "team-name";
            teamCell.innerText = teamObj.name;
            row.appendChild(teamCell);

            for (let i = 0; i < 5; i++) {
                let td = document.createElement("td");
                let input = document.createElement("input");
                input.type = "number";
                input.min = "0";
                input.id = `t${teamObj.originalIndex}_r${i + 1}`;
                input.value = teamObj.rounds[i];
                input.oninput = updateTotalsAndSort; 
                td.appendChild(input);
                row.appendChild(td);
            }

            let totalTd = document.createElement("td");
            totalTd.className = "total-mark";
            totalTd.id = `total_${teamObj.originalIndex}`;
            totalTd.innerText = teamObj.hasValue ? teamObj.total : "";
            row.appendChild(totalTd);

            tableBody.appendChild(row);
        });
    }

    function updateTotalsAndSort() {
        teamNames.forEach((_, index) => {
            if (!sheetData[index + 1]) sheetData[index + 1] = [teamNames[index]];
            for (let i = 1; i <= 5; i++) {
                let val = document.getElementById(`t${index}_r${i}`).value;
                sheetData[index + 1][i] = val;
            }
        });
        renderTable();
    }

    loadSheetData();
</script>

</body>
</html>
