<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Score Board - Live Sorted</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        input[type="number"] {
            width: 60px;
            padding: 6px;
            text-align: center;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .total-mark {
            font-weight: bold;
            color: #28a745;
            font-size: 18px;
        }
        .team-name {
            font-weight: bold;
            color: #0056b3;
        }
        .loading {
            text-align: center;
            color: #666;
            margin-bottom: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏆 Quiz Score Board (Sorted: Lowest to Highest Total)</h2>
    <div id="status" class="loading">Google Sheet-ൽ നിന്ന് ഡാറ്റ ലോഡ് ചെയ്യുന്നു...</div>
    <table>
        <thead>
            <tr>
                <th>Teams</th>
                <th>Round 1</th>
                <th>Round 2</th>
                <th>Round 3</th>
                <th>Round 4</th>
                <th>Round 5</th>
                <th>Total Mark</th>
            </tr>
        </thead>
        <tbody id="scoreTableBody">
            <!-- JavaScript വഴി ഡാറ്റ ഇവിടെ ലോഡ് ചെയ്യപ്പെടും -->
        </tbody>
    </table>
</div>

<script>
    const teamNames = ["Team A", "Team B", "Team C", "Team D", "Team E"];
    const appScriptUrl = "https://script.google.com/macros/s/AKfycbyUFELQsY3E2GPkFY62aV2q2y2z6w2kvryHuibo2PMljwEVLaEcnHHjpwWMxeSgYkeVeA/exec"; 

    let sheetData = [];

    async function loadSheetData() {
        try {
            let response = await fetch(appScriptUrl);
            sheetData = await response.json();
            renderTable();
            document.getElementById("status").innerText = "ഡാറ്റ വിജയകരമായി ലോഡ് ചെയ്തു!";
        } catch (error) {
            console.error("Error loading sheet:", error);
            renderTable();
            document.getElementById("status").innerText = "ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ പരാജയപ്പെട്ടു.";
        }
    }

    function renderTable() {
        const tableBody = document.getElementById("scoreTableBody");
        tableBody.innerHTML = "";

        // എല്ലാ ടീമുകളുടെയും ഡാറ്റയും ടോട്ടലും കണക്കുകൂട്ടുക
        let teamsArray = teamNames.map((team, index) => {
            let rounds = [];
            let total = 0;
            let hasValue = false;

            for (let i = 1; i <= 5; i++) {
                let val = "";
                // ഷീറ്റിൽ നിന്ന് ഡാറ്റ എടുക്കുക (index + 1 because row 0 is header)
                if (sheetData[index + 1] && sheetData[index + 1][i] !== undefined && sheetData[index + 1][i] !== "") {
                    val = sheetData[index + 1][i];
                    total += parseFloat(val) || 0;
                    hasValue = true;
                }
                rounds.push(val);
            }

            return {
                name: team,
                originalIndex: index,
                rounds: rounds,
                total: total,
                hasValue: hasValue
            };
        });

        // സോർട്ട് ചെയ്യുക: കുറഞ്ഞ പോയിന്റ് ഉള്ളവർ ആദ്യം, കൂടുതൽ ഉള്ളവർ ഒടുവിൽ (Ascending Order)
        // മാർക്ക് എന്റർ ചെയ്യാത്തവരെ (hasValue false) ഏറ്റവും താഴെയായി നിർത്താൻ ടോട്ടൽ വലിയൊരു നമ്പരായി കണക്കാക്കാം
        teamsArray.sort((a, b) => {
            let valA = a.hasValue ? a.total : 999999;
            let valB = b.hasValue ? b.total : 999999;
            return valA - valB;
        });

        // ടേബിളിലേക്ക് റോകൾ ചേര്‍ക്കുക
        teamsArray.forEach((teamObj) => {
            let row = document.createElement("tr");
            
            let teamCell = document.createElement("td");
            teamCell.className = "team-name";
            teamCell.innerText = teamObj.name;
            row.appendChild(teamCell);

            for (let i = 0; i < 5; i++) {
                let td = document.createElement("td");
                let input = document.createElement("input");
                input.type = "number";
                input.min = "0";
                input.id = `t${teamObj.originalIndex}_r${i + 1}`;
                input.value = teamObj.rounds[i];
                input.oninput = updateTotalsAndSort; 
                td.appendChild(input);
                row.appendChild(td);
            }

            let totalTd = document.createElement("td");
            totalTd.className = "total-mark";
            totalTd.id = `total_${teamObj.originalIndex}`;
            totalTd.innerText = teamObj.hasValue ? teamObj.total : "";
            row.appendChild(totalTd);

            tableBody.appendChild(row);
        });
    }

    // മാനുവലായി ഇൻപുട്ട് മാറ്റുമ്പോൾ ലൈവ് ആയി ടോട്ടൽ കാൽക്കുലേറ്റ് ചെയ്ത് സോർട്ട് ചെയ്യാനും
    function updateTotalsAndSort() {
        // ഇൻപുട്ട് മാറ്റങ്ങൾ ഷീറ്റ് ഡാറ്റയിലേക്ക് അപ്ഡേറ്റ് ചെയ്യുക
        teamNames.forEach((_, index) => {
            if (!sheetData[index + 1]) sheetData[index + 1] = [teamNames[index]];
            for (let i = 1; i <= 5; i++) {
                let val = document.getElementById(`t${index}_r${i}`).value;
                sheetData[index + 1][i] = val;
            }
        });
        renderTable();
    }

    loadSheetData();
</script>

</body>
</html>
