<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Score Board - Custom Badges</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 900px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        input[type="number"] {
            width: 60px;
            padding: 6px;
            text-align: center;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .total-mark {
            font-weight: bold;
            color: #28a745;
            font-size: 18px;
        }
        .team-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .team-name {
            font-weight: bold;
            color: #0056b3;
            font-size: 16px;
        }
        .badge-icon {
            width: 32px;
            height: 32px;
            vertical-align: middle;
        }
        .loading {
            text-align: center;
            color: #666;
            margin-bottom: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏆 Quiz Score Board (Rank Badges)</h2>
    <div id="status" class="loading">Google Sheet-ൽ നിന്ന് ഡാറ്റ ലോഡ് ചെയ്യുന്നു...</div>
    <table>
        <thead>
            <tr>
                <th>Teams</th>
                <th>Round 1</th>
                <th>Round 2</th>
                <th>Round 3</th>
                <th>Round 4</th>
                <th>Round 5</th>
                <th>Total Mark</th>
            </tr>
        </thead>
        <tbody id="scoreTableBody">
            <!-- JavaScript വഴി ഡാറ്റ ഇവിടെ ലോഡ് ചെയ്യപ്പെടും -->
        </tbody>
    </table>
</div>

<script>
    const teamNames = ["Team A", "Team B", "Team C", "Team D", "Team E"];
    const appScriptUrl = "https://script.google.com/macros/s/AKfycbyUFELQsY3E2GPkFY62aV2q2y2z6w2kvryHuibo2PMljwEVLaEcnHHjpwWMxeSgYkeVeA/exec"; 

    // നിങ്ങൾ അയച്ച ചിത്രത്തിന് സമാനമായ വെബ് ബാഡ്ജ് ലിങ്കുകൾ (1st, 2nd, 3rd)
    const badges = {
        1: "https://img.icons8.com/color/96/1st-place-medal.png", // 1st Place Badge
        2: "https://img.icons8.com/color/96/2nd-place-medal.png", // 2nd Place Badge
        3: "https://img.icons8.com/color/96/3rd-place-medal.png"  // 3rd Place Badge
    };

    let sheetData = [];

    async function loadSheetData() {
        try {
            let response = await fetch(appScriptUrl);
            sheetData = await response.json();
            renderTable();
            document.getElementById("status").innerText = "ഡാറ്റ വിജയകരമായി ലോഡ് ചെയ്തു!";
        } catch (error) {
            console.error("Error loading sheet:", error);
            renderTable();
            document.getElementById("status").innerText = "ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ പരാജയപ്പെട്ടു.";
        }
    }

    function renderTable() {
        const tableBody = document.getElementById("scoreTableBody");
        tableBody.innerHTML = "";

        let teamsArray = teamNames.map((team, index) => {
            let rounds = [];
            let total = 0;
            let hasValue = false;

            for (let i = 1; i <= 5; i++) {
                let val = "";
                if (sheetData[index + 1] && sheetData[index + 1][i] !== undefined && sheetData[index + 1][i] !== "") {
                    val = sheetData[index + 1][i];
                    total += parseFloat(val) || 0;
                    hasValue = true;
                }
                rounds.push(val);
            }

            return {
                name: team,
                originalIndex: index,
                rounds: rounds,
                total: total,
                hasValue: hasValue
            };
        });

        // കുറഞ്ഞ പോയിന്റ് ഉള്ളവർ മുകളിലും, കൂടുതൽ പോയിന്റ് ഉള്ളവർ താഴെയും വരത്തക്കവിധം സോർട്ട് ചെയ്യുന്നു
        teamsArray.sort((a, b) => {
            let valA = a.hasValue ? a.total : 999999;
            let valB = b.hasValue ? b.total : 999999;
            return valA - valB;
        });

        teamsArray.forEach((teamObj) => {
            let row = document.createElement("tr");
            
            let teamCell = document.createElement("td");
            
            let teamDiv = document.createElement("div");
            teamDiv.className = "team-container";

            let nameSpan = document.createElement("span");
            nameSpan.className = "team-name";
            nameSpan.innerText = teamObj.name;
            teamDiv.appendChild(nameSpan);

            // ഏറ്റവും കൂടുതൽ പോയിന്റ് നേടിയ ആദ്യ 3 ടീമുകൾക്ക് ബാഡ്ജ് നൽകുക (താഴെ നിന്ന് മുകളിലേക്ക് 1, 2, 3)
            if (teamObj.hasValue) {
                let rankFromBottom = teamsArray.length - teamsArray.indexOf(teamObj);
                if (rankFromBottom >= 1 && rankFromBottom <= 3) {
                    let badgeImg = document.createElement("img");
                    badgeImg.src = badges[rankFromBottom];
                    badgeImg.className = "badge-icon";
                    badgeImg.alt = `${rankFromBottom} Place`;
                    teamDiv.appendChild(badgeImg);
                }
            }

            teamCell.appendChild(teamDiv);
            row.appendChild(teamCell);

            for (let i = 0; i < 5; i++) {
                let td = document.createElement("td");
                let input = document.createElement("input");
                input.type = "number";
                input.min = "0";
                input.id = `t${teamObj.originalIndex}_r${i + 1}`;
                input.value = teamObj.rounds[i];
                input.oninput = updateTotalsAndSort; 
                td.appendChild(input);
                row.appendChild(td);
            }

            let totalTd = document.createElement("td");
            totalTd.className = "total-mark";
            totalTd.id = `total_${teamObj.originalIndex}`;
            totalTd.innerText = teamObj.hasValue ? teamObj.total : "";
            row.appendChild(totalTd);

            tableBody.appendChild(row);
        });
    }

    function updateTotalsAndSort() {
        teamNames.forEach((_, index) => {
            if (!sheetData[index + 1]) sheetData[index + 1] = [teamNames[index]];
            for (let i = 1; i <= 5; i++) {
                let val = document.getElementById(`t${index}_r${i}`).value;
                sheetData[index + 1][i] = val;
            }
        });
        renderTable();
    }

    loadSheetData();
</script>

</body>
</html>
