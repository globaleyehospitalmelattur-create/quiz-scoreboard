<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Score Board - Eyecon Style</title>
    <!-- Confetti effect-inu vendulla library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-bg: #f3f4f6;
            --card-bg: #ffffff;
            --accent-color: #6366f1; /* Eyecon style vibrant indigo */
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --winner-bg: #fef08a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 950px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: var(--text-main);
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        h2 span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            text-align: center;
        }

        th, td {
            padding: 18px 15px;
            vertical-align: middle;
        }

        th {
            background: var(--accent-gradient);
            color: white;
            font-weight: 600;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:not(:last-child) td {
            border-bottom: 1px solid var(--border-color);
        }

        tr:nth-child(even) td {
            background-color: #f9fafb;
        }

        tbody tr {
            opacity: 0;
            transform: translateY(20px);
            animation: cinematicFadeIn 0.8s ease forwards;
        }

        @keyframes cinematicFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        input[type="number"] {
            width: 65px;
            padding: 10px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            background-color: #f3f4f6;
            border: 2px solid transparent;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            background-color: #ffffff;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .total-mark {
            font-weight: 800;
            color: #059669;
            font-size: 20px;
        }

        .team-name {
            font-weight: 700;
            color: #374151;
            font-size: 17px;
            text-align: left;
            padding-left: 25px;
        }

        .winner-row td {
            background-color: var(--winner-bg) !important;
            transition: background-color 0.5s ease;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
            gap: 12px;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏆 <span>Quiz Score Board</span></h2>
    
    <div id="status" class="loading-container">
        <div class="spinner"></div>
        <div class="loading-text">ഡാറ്റ ലോഡ് ചെയ്യുന്നു...</div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th style="text-align: left; padding-left: 25px;">Teams</th>
                    <th>Round 1</th>
                    <th>Round 2</th>
                    <th>Round 3</th>
                    <th>Round 4</th>
                    <th>Round 5</th>
                    <th>Total Mark</th>
                </tr>
            </thead>
            <tbody id="scoreTableBody">
                <!-- Data ivide load aakum -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const teamNames = ["Team A", "Team B", "Team C", "Team D", "Team E"];
    const appScriptUrl = "https://script.google.com/macros/s/AKfycbyUFELQsY3E2GPkFY62aV2q2y2z6w2kvryHuibo2PMljwEVLaEcnHHjpwWMxeSgYkeVeA/exec"; 

    let sheetData = [];

    async function loadSheetData() {
        try {
            let response = await fetch(appScriptUrl);
            if (!response.ok) {
                throw new Error("Network response was not ok");
            }
            sheetData = await response.json();
            renderTable();
            document.getElementById("status").style.display = "none";
        } catch (error) {
            console.error("Error loading sheet:", error);
            sheetData = [];
            renderTable();
            document.getElementById("status").innerHTML = '<div style="color: #ef4444;">ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ പരാജയപ്പെട്ടു. URL പരിശോധിക്കുക!</div>';
        }
    }

    function renderTable() {
        const tableBody = document.getElementById("scoreTableBody");
        tableBody.innerHTML = "";

        let teamsArray = teamNames.map((team, index) => {
            let rounds = [];
            let total = 0;
            let hasValue = false;
            let filledRoundsCount = 0;

            for (let i = 1; i <= 5; i++) {
                let val = "";
                if (sheetData[index + 1] && sheetData[index + 1][i] !== undefined && sheetData[index + 1][i] !== "") {
                    val = sheetData[index + 1][i];
                    total += parseFloat(val) || 0;
                    hasValue = true;
                    filledRoundsCount++;
                }
                rounds.push(val);
            }

            return {
                name: team,
                originalIndex: index,
                rounds: rounds,
                total: total,
                hasValue: hasValue,
                isAllFiveRoundsFilled: (filledRoundsCount === 5)
            };
        });

        teamsArray.sort((a, b) => {
            let valA = a.hasValue ? a.total : 999999;
            let valB = b.hasValue ? b.total : 999999;
            return valA - valB;
        });

        let allTeamsHaveFiveRounds = teamsArray.length > 0 && teamsArray.every(team => team.isAllFiveRoundsFilled);

        teamsArray.forEach((teamObj, index) => {
            let row = document.createElement("tr");
            
            let delayTime = 0;
            if (allTeamsHaveFiveRounds) {
                delayTime = index * 10;
            } else {
                delayTime = 0; 
            }
            
            row.style.animationDelay = `${delayTime}s`;

            let isLastRow = (index === teamsArray.length - 1);
            if (isLastRow && teamObj.hasValue) {
                row.className = "winner-row";
                setTimeout(() => {
                    confetti({
                        particleCount: 150,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                }, delayTime * 1000);
            }

            let teamCell = document.createElement("td");
            teamCell.className = "team-name";
            teamCell.innerText = teamObj.name;
            row.appendChild(teamCell);

            for (let i = 0; i < 5; i++) {
                let td = document.createElement("td");
                let input = document.createElement("input");
                input.type = "number";
                input.min = "0";
                input.id = `t${teamObj.originalIndex}_r${i + 1}`;
                input.value = teamObj.rounds[i];
                input.oninput = updateTotalsAndSort; 
                td.appendChild(input);
                row.appendChild(td);
            }

            let totalTd = document.createElement("td");
            totalTd.className = "total-mark";
            totalTd.id = `total_${teamObj.originalIndex}`;
            totalTd.innerText = teamObj.hasValue ? teamObj.total : "";
            row.appendChild(totalTd);

            tableBody.appendChild(row);
        });
    }

    function updateTotalsAndSort() {
        teamNames.forEach((_, index) => {
            if (!sheetData[index + 1]) sheetData[index + 1] = [teamNames[index]];
            for (let i = 1; i <= 5; i++) {
                let val = document.getElementById(`t${index}_r${i}`).value;
                sheetData[index + 1][i] = val;
            }
        });
        renderTable();
    }

    loadSheetData();
</script>

</body>
</html>
